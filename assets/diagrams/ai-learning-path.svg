<text x="720.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Specialize</text>
<text x="720.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">vision, NLP, RL, generative</text>
<text x="920.0" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#7c3aed">STAGE 5</text>

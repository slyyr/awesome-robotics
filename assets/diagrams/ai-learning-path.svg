<text x="120.0" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563eb">STAGE 1</text>
<rect x="40" y="78.0" width="160" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="120.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Foundations</text>
<text x="120.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">Python, linear algebra, probability</text>
<text x="320.0" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#16a34a">STAGE 2</text>
<rect x="240" y="78.0" width="160" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="320.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Classical ML</text>
<text x="320.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">regression, trees, evaluation</text>
<text x="520.0" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">STAGE 3</text>
<rect x="440" y="78.0" width="160" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="520.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Deep learning</text>
<text x="520.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">networks, training, PyTorch</text>
<text x="720.0" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#db2777">STAGE 4</text>

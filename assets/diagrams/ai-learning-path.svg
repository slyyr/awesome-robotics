<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 172" role="img" aria-labelledby="t d">
<title id="t">AI learning path</title><desc id="d">From Python and math foundations through classical ML and deep learning to specialization and building real systems.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1040" height="172" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="520.0" y="30" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">AI learning path</text>
<line x1="200" y1="105.0" x2="237" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>
<line x1="400" y1="105.0" x2="437" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>
<line x1="600" y1="105.0" x2="637" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 222" role="img" aria-labelledby="t d">
<title id="t">Machine learning workflow</title><desc id="d">Frame the problem, gather data, build a baseline, train, evaluate, deploy and monitor, then loop back to data.</desc>

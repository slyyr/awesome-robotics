<rect x="40" y="78.0" width="140" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="110.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Frame problem</text>

<text x="286.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">collect, clean, split</text>
<rect x="392" y="78.0" width="140" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="462.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Baseline</text>

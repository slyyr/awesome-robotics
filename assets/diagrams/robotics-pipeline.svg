<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 222" role="img" aria-labelledby="t d">
<title id="t">The robotics pipeline</title><desc id="d">Sensing feeds perception, localization and mapping, planning, control and actuation, with feedback from the world.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1100" height="222" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="550.0" y="30" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">The robotics pipeline</text>
<line x1="180" y1="105.0" x2="213" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>
<line x1="356" y1="105.0" x2="389" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>
<line x1="532" y1="105.0" x2="565" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>
<line x1="708" y1="105.0" x2="741" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>
<line x1="884" y1="105.0" x2="917" y2="105.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" opacity="0.8"/>
<path d="M990.0 134.0 C990.0 177.0, 110.0 177.0, 110.0 136.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="550.0" y="184.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-style="italic" fill="#475569">the world responds, sensors observe again</text>
<rect x="40" y="78.0" width="140" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="110.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Sensing</text>
<text x="110.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">cameras, lidar, IMU</text>
<rect x="216" y="78.0" width="140" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="286.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Perception</text>
<text x="286.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">what is around me?</text>
<rect x="392" y="78.0" width="140" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="462.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Localize &amp; Map</text>
<text x="462.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">where am I?</text>
<rect x="568" y="78.0" width="140" height="54" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="638.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Planning</text>
<text x="638.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">where should I go?</text>
<rect x="744" y="78.0" width="140" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="814.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Control</text>
<text x="814.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">how do I get there?</text>
<rect x="920" y="78.0" width="140" height="54" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
<text x="990.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Actuation</text>
<text x="990.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#475569">motors &amp; joints</text>
